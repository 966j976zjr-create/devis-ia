<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a172b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Devis IA">
  <meta name="description" content="Chiffrage intelligent en sûreté électronique — application locale sans abonnement">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Devis IA · Chiffrage intelligent</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brandmark" aria-hidden="true">D<span>·</span></div>
      <div class="brandname"><strong>Devis IA</strong><small>Chiffrage • Sûreté électronique</small></div>
      <span class="topbadge">V1 locale</span>
    </header>
    <main id="mainContent" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Navigation principale">
      <button type="button" data-tab="nouveau"><span class="nav-icon">✦</span><span>Nouveau</span></button>
      <button type="button" data-tab="devis"><span class="nav-icon">▤</span><span>Devis</span></button>
      <button type="button" data-tab="catalogue"><span class="nav-icon">▦</span><span>Catalogue</span></button>
      <button type="button" data-tab="reglages"><span class="nav-icon">⚙</span><span>Réglages</span></button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="printArea" aria-hidden="true"></div>
  <script src="app.js" defer></script>
</body>
</html>
